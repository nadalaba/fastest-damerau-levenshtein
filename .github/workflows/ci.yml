name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-lint-test-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Build
        run: pn build

      - name: Lint
        if: ${{ matrix.node >= 20 }}
        run: pn lint

      - name: Test
        run: pn test

      - name: Format
        if: ${{ matrix.node >= 20 }}
        run: pn format:check
