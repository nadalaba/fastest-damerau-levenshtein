name: CI

on: [push, pull_request]

jobs:
  build-test-lint-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Build
        run: pn build

      - name: Smoke Test - ESM
        run: pn smoke-test:esm

      - name: Smoke Test - CJS
        run: pn smoke-test:cjs

      - name: Test
        run: pn test

      - name: Lint
        if: ${{ matrix.node >= 20 }}
        run: pn lint

      - name: Format
        if: ${{ matrix.node >= 20 }}
        run: pn format:check
