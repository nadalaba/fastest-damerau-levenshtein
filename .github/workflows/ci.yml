name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Build
        run: pn build

      - name: TypeScript type-check
        run: pn typecheck

      - name: Lint
        run: pn lint

      - name: Test
        run: pn test

      - name: Format check
        run: pn format:check
